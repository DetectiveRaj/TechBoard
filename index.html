<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBoard - Drawing & Whiteboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🎨 TechBoard</h1>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <!-- Drawing Tools -->
            <div class="tool-group">
                <label>Drawing</label>
                <button class="tool-btn active" data-tool="pen" title="Pen">✏️</button>
                <button class="tool-btn" data-tool="eraser" title="Eraser">🧹</button>
            </div>

            <!-- Shapes Dropdown -->
            <div class="tool-group">
                <label>Shapes</label>
                <div class="dropdown">
                    <button class="tool-btn dropdown-btn" title="Shapes Menu">▼ Shapes</button>
                    <div class="dropdown-content">
                        <button class="tool-btn" data-tool="line" title="Line">📏 Line</button>
                        <button class="tool-btn" data-tool="rectangle" title="Rectangle">▭ Rectangle</button>
                        <button class="tool-btn" data-tool="circle" title="Circle">● Circle</button>
                        <button class="tool-btn" data-tool="ellipse" title="Ellipse">⬭ Ellipse</button>
                        <button class="tool-btn" data-tool="triangle" title="Triangle">△ Triangle</button>
                        <button class="tool-btn" data-tool="polygon" title="Polygon">⬠ Polygon</button>
                        <button class="tool-btn" data-tool="star" title="Star">⭐ Star</button>
                        <button class="tool-btn" data-tool="arrow" title="Arrow">➜ Arrow</button>
                        <button class="tool-btn" data-tool="rightarrow" title="Right Arrow">→ RightArrow</button>
                        <button class="tool-btn" data-tool="diamond" title="Diamond">◇ Diamond</button>
                        <button class="tool-btn" data-tool="hexagon" title="Hexagon">⬡ Hexagon</button>
                        <button class="tool-btn" data-tool="heart" title="Heart">♥ Heart</button>
                    </div>
                </div>
            </div>

            <!-- Text Tool -->
            <div class="tool-group">
                <button class="tool-btn" data-tool="text" title="Text">📝 Text</button>
            </div>

            <!-- Image Insert -->
            <div class="tool-group">
                <input type="file" id="imageInput" accept="image/*" style="display:none;">
                <button class="tool-btn" id="imageBtn" title="Insert Image">🖼️ Image</button>
            </div>

            <!-- Colors -->
            <div class="tool-group">
                <label>Color</label>
                <input type="color" id="colorPicker" value="#000000" title="Pick color">
                <div class="color-presets">
                    <div class="color-preset" data-color="#000000" style="background: #000000;" title="Black"></div>
                    <div class="color-preset" data-color="#FF0000" style="background: #FF0000;" title="Red"></div>
                    <div class="color-preset" data-color="#00AA00" style="background: #00AA00;" title="Green"></div>
                    <div class="color-preset" data-color="#0000FF" style="background: #0000FF;" title="Blue"></div>
                    <div class="color-preset" data-color="#FFAA00" style="background: #FFAA00;" title="Orange"></div>
                    <div class="color-preset" data-color="#FF00FF" style="background: #FF00FF;" title="Purple"></div>
                </div>
            </div>

            <!-- Fill Toggle -->
            <div class="tool-group">
                <label>Fill</label>
                <input type="checkbox" id="fillToggle" title="Toggle shape fill">
            </div>

            <!-- Brush Size -->
            <div class="tool-group">
                <label>Size</label>
                <input type="range" id="brushSize" min="1" max="50" value="3" title="Adjust brush size">
                <span id="brushSizeLabel">3</span>px
            </div>

            <!-- Canvas Actions -->
            <div class="tool-group">
                <button id="undoBtn" class="tool-btn" title="Undo (Ctrl+Z)">↶</button>
                <button id="redoBtn" class="tool-btn" title="Redo (Ctrl+Y)">↷</button>
                <button id="clearBtn" class="tool-btn danger" title="Clear Canvas">🗑️</button>
                <button id="downloadBtn" class="tool-btn success" title="Download as PNG">⬇️</button>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-container">
            <canvas id="drawingCanvas"></canvas>
            <div id="textInputBox" class="text-input-box" style="display: none;">
                <input type="text" id="textInput" placeholder="Enter text..." autocomplete="off">
            </div>
        </div>

        <!-- Status Bar -->
        <footer class="status-bar">
            <span id="toolStatus">Tool: Pen | Ready to draw</span>
            <span id="coordinateInfo">X: 0, Y: 0</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
